version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router-dom']
      build-tools:
        patterns: ['vite', '@vitejs/*', 'vitest', 'tailwindcss', 'postcss', 'autoprefixer']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
