<!doctype html>
<!--
  Source for public/og-image.png (1200×630).
  Regenerate with a headless browser, e.g.:
    msedge --headless=new --window-size=1200,630 --screenshot=public/og-image.png scripts/og-image.html
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; color: #fff;
        background: radial-gradient(circle at 80% 10%, rgba(16,185,129,.28), transparent 45%),
                    radial-gradient(circle at 10% 90%, rgba(99,102,241,.35), transparent 50%), #070b17;
        padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 16px; font: 700 40px 'Space Grotesk', sans-serif; }
      .logo { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg,#6366f1,#10b981); display: grid; place-items: center; font-size: 38px; }
      h1 { font: 700 76px/1.02 'Space Grotesk', sans-serif; letter-spacing: -1.5px; max-width: 900px; }
      h1 span { background: linear-gradient(90deg,#a5b4fc,#34d399); -webkit-background-clip: text; color: transparent; }
      .pills { display: flex; gap: 14px; }
      .pill { border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 12px 22px; font-size: 24px; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div class="brand"><div class="logo">N</div>Nexlm</div>
    <h1>Buy &amp; sell XLM for <span>Naira</span>, peer to peer.</h1>
    <div class="pills">
      <div class="pill">On-chain Stellar escrow</div>
      <div class="pill">Zero trading fees</div>
      <div class="pill">Bank · OPay · PalmPay · Kuda</div>
    </div>
  </body>
</html>
